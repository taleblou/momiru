[package]
name = "momiru"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.1"
authors = ["Morteza Taleblou", "Mitra Daneshmand"]
license = "MIT"
description = "Independent generic-ND and fixed-rank f32 tensor modules with UASDEA execution"
repository = "https://github.com/taleblou/momiru"
readme = "README.md"
build = "build.rs"
keywords = ["tensor", "rust", "numerics", "cpu", "uasdea"]
categories = ["science", "data-structures"]

[lib]
name = "momiru"
path = "src/lib.rs"

[features]
default = []
aot = []

[dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
overflow-checks = false
debug-assertions = false
incremental = false
debug = 0
strip = "none"
rpath = false

[[bench]]
name = "tensor_cpu_activation_same_shape"
path = "benches/tensor_cpu_activation_same_shape.rs"
harness = false

