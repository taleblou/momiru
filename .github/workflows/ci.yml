name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Rust validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
      - name: Validate Cargo metadata
        run: cargo metadata --locked --no-deps --format-version 1
      - name: Compile library and all configured targets
        run: cargo check --locked --all-targets
      - name: Compile and execute default tests
        run: cargo test --locked
      - name: Compile and execute optional AOT tests
        run: cargo test --locked --features aot
